plugins {
    id 'com.android.application'
}

// Optional independent installer: leaves the existing APK and customer lists intact.
def parallelCatalog = project.findProperty('parallelCatalog') == 'true'

android {
    namespace 'mk.seteczaliha.app'
    compileSdk 35

    defaultConfig {
        applicationId = parallelCatalog ? 'mk.setecsifri.compare60.catalog64' : 'mk.setecsifri.compare60'
        manifestPlaceholders = [appLabel: 'Setec Tools']
        minSdk 26
        targetSdk 35
        versionCode 64
        versionName '1.4-offer-export-pn'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.core:core:1.15.0'
    implementation 'androidx.activity:activity:1.9.3'
    implementation 'androidx.camera:camera-core:1.4.2'
    implementation 'androidx.camera:camera-camera2:1.4.2'
    implementation 'androidx.camera:camera-lifecycle:1.4.2'
    implementation 'androidx.camera:camera-view:1.4.2'
    implementation 'com.google.mlkit:text-recognition:16.0.1'
    implementation 'com.google.mlkit:barcode-scanning:17.3.0'
    implementation 'org.jsoup:jsoup:1.18.3'
    testImplementation 'junit:junit:4.13.2'
}
