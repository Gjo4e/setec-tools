name: Diagnose SETEC category pages
on:
  push:
    branches: ['feature/datamatrix-setec-scan-2026-11-06']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - name: Install Playwright
        run: |
          python3 -m pip install --quiet playwright
          python3 -m playwright install chromium
      - name: Inspect category links, product DOM and page navigation
        run: |
          cat > /tmp/probe_setec_category_dom.py <<'PY'
          from playwright.sync_api import sync_playwright
          import json, re, time
          urls=[
           'https://www.setec.mk/category/televizori-55',
           'https://www.setec.mk/category/konfiguratsii-32',
           'https://www.setec.mk/category/matichni-20plochi-22',
           'https://www.setec.mk/category/komp-d1-98uteri-20i-20it-20oprema-19',
           'https://www.setec.mk/category/konfiguratsii-32?page=2'
          ]
          with sync_playwright() as p:
            browser=p.chromium.launch(headless=True,args=['--no-sandbox'])
            page=browser.new_page(viewport={'width':1240,'height':850},locale='mk-MK')
            for url in urls:
              print('URL',url,flush=True)
              try:
                r=page.goto(url,wait_until='domcontentloaded',timeout=23000)
                for delay in [700,2600,4500]:
                  page.wait_for_timeout(delay if delay==700 else delay-700 if delay==2600 else delay-2600)
                  stats=page.evaluate('''() => {
                    const links=[...document.querySelectorAll('a[href]')];
                    const productlinks=links.filter(a=>{try{return new URL(a.href,location.href).pathname.startsWith('/products/')}catch(e){return false}});
                    const categorylinks=links.filter(a=>{try{return new URL(a.href,location.href).pathname.startsWith('/category/')}catch(e){return false}});
                    const products=[...document.querySelectorAll('[class*=product],[class*=Product],article')];
                    const pagers=[...document.querySelectorAll('button,a,[role=button]')].filter(x=>/^(1|2|3|Next|Следна|›|»|→)$/.test((x.textContent||'').trim()));
                    return {title:document.title,pathname:location.pathname,bodyText:(document.body?.innerText||'').slice(0,300),productLinks:productlinks.length,productLinkExamples:productlinks.slice(0,3).map(a=>({href:a.href,text:(a.innerText||'').slice(0,60)})),categoryLinks:categorylinks.length,productNodes:products.length,pagers:pagers.slice(0,8).map(p=>({tag:p.tagName,text:(p.innerText||'').trim(),outer:p.outerHTML.slice(0,400)})),productHtml:productlinks[0]?.parentElement?.parentElement?.outerHTML.slice(0,1800)||products.find(x=>(x.innerText||'').includes('Клуб цена'))?.outerHTML.slice(0,1500)||'',nextUrl:[...new Set(links.filter(a=>a.href.includes('page=2')).map(a=>a.href))].slice(0,4)};
                  }''')
                  print('AT',delay,'STATS',json.dumps(stats,ensure_ascii=False),flush=True)
              except Exception as e:print('ERROR',repr(e)[:350],flush=True)
            browser.close()
          PY
          python3 /tmp/probe_setec_category_dom.py
