name: Archive untouched Setec Tools backup
on:
  push:
    branches: ['feature/datamatrix-setec-scan-2026-11-06']
    paths:
      - '.github/workflows/archive-backup.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: backup/before-web-and-search-ui-2026-11-07
          fetch-depth: 1
      - name: Archive the exact pre-edit project
        run: |
          mkdir -p dist
          git archive --format=zip --output=dist/Setec-Tools-BACKUP-before-web-2026-11-07.zip HEAD
          unzip -t dist/Setec-Tools-BACKUP-before-web-2026-11-07.zip | tail -2
      - uses: actions/upload-artifact@v4
        with:
          name: Setec-Tools-BACKUP-source
          path: dist/Setec-Tools-BACKUP-before-web-2026-11-07.zip
          if-no-files-found: error
