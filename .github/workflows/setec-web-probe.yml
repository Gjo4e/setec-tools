name: Check SETEC web API availability
on:
  workflow_dispatch:
  push:
    branches: ['feature/datamatrix-setec-scan-2026-11-06']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Inspect public CORS headers
        run: |
          python3 - <<'PY'
          import urllib.request
          urls=['https://www.setec.mk/api/strapi/category?locale=mk-MK&withSubcategories=true','https://www.setec.mk/category/konfiguratsii-32']
          for u in urls:
            for method in ['GET','OPTIONS']:
              req=urllib.request.Request(u,method=method,headers={'Origin':'https://example.github.io','Access-Control-Request-Method':'GET','User-Agent':'Mozilla/5.0'})
              try:
                with urllib.request.urlopen(req,timeout=20) as r:
                  print(method,u,'status',r.status,'CORS',r.headers.get('Access-Control-Allow-Origin'),'length',r.headers.get('Content-Length'),flush=True)
              except Exception as e:print(method,u,'error',str(e)[:250],flush=True)
          PY
      - name: Capture only public category API request shapes
        run: |
          pip install --quiet playwright
          python -m playwright install chromium
          python3 - <<'PY'
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
            b=p.chromium.launch(headless=True,args=['--no-sandbox'])
            page=b.new_page()
            calls=[]
            def log(request):
              if any(x in request.url for x in ['/api/strapi/','/indexes/','/api/medusa/']) and len(calls)<25:
                calls.append({'url':request.url[:250],'method':request.method,'body':(request.post_data or '')[:650]})
            page.on('request',log)
            page.goto('https://www.setec.mk/category/konfiguratsii-32',wait_until='domcontentloaded',timeout=35000)
            page.wait_for_timeout(3500)
            for call in calls:
              print('API_CALL',call,flush=True)
            b.close()
          PY
