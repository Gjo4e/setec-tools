name: Build Setec Zaliha APK
on:
  push:
    branches: [main, 'feature/datamatrix-setec-scan-2026-11-06']
    paths:
      - 'app/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: ''
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Test model recognition
        run: gradle --no-daemon :app:testDebugUnitTest --stacktrace
      - name: Build original-package APK
        run: |
          gradle --no-daemon :app:assembleDebug --stacktrace
          mkdir -p app/build/outputs/release-candidates
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/release-candidates/SETEC-TOOLS-Update-v64.apk
      - name: Build side-by-side category APK
        run: |
          gradle --no-daemon -PparallelCatalog=true :app:assembleDebug --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/release-candidates/SETEC-TOOLS-v64-Separate.apk
      - name: Verify both APK application IDs and labels
        shell: bash
        run: |
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          "$AAPT" dump badging app/build/outputs/release-candidates/SETEC-TOOLS-Update-v64.apk | grep "package: name='mk.setecsifri.compare60'"
          "$AAPT" dump badging app/build/outputs/release-candidates/SETEC-TOOLS-v64-Separate.apk | grep "package: name='mk.setecsifri.compare60.catalog63'"
          "$AAPT" dump badging app/build/outputs/release-candidates/SETEC-TOOLS-v64-Separate.apk | grep "application-label:'Setec Tools'"
      - uses: actions/upload-artifact@v4
        with:
          name: Setec-Zaliha-APK
          path: app/build/outputs/release-candidates/SETEC-TOOLS-Update-v64.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: Setec-Categories-v64-Separate
          path: app/build/outputs/release-candidates/SETEC-TOOLS-v64-Separate.apk
          if-no-files-found: error
