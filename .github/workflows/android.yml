name: Build Setec Tools APK
# Barcode scanner build: EAN-13, UPC-A, Code128, Data Matrix, guide ROI, manual modes, automated online product research - SETEC specs and relevance fix
on:
  push:
    branches: [main, 'feature/datamatrix-setec-scan-2026-11-06', 'fix-offer-export-installments-20261108']
    paths:
      - 'app/**'
      - '.github/workflows/android.yml'
  pull_request:
    branches: ['backup/before-category-specific-comparison-2026-11-07', main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve app version
        run: |
          minor=$((GITHUB_RUN_NUMBER-680))
          if [ "$minor" -lt 2 ]; then minor=2; fi
          echo "APP_VERSION=7.$minor" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: ''
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Test model recognition
        run: gradle --no-daemon :app:testDebugUnitTest --stacktrace
      - name: Build original-package APK
        run: |
          gradle --no-daemon -PupdateVersionCode=$((1000+GITHUB_RUN_NUMBER)) -PupdateVersionName=${APP_VERSION} :app:assembleDebug --stacktrace
          mkdir -p app/build/outputs/release-candidates
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/release-candidates/SETEC-TOOLS-Update-v65.apk
      - name: Build side-by-side category APK
        run: |
          gradle --no-daemon -PparallelCatalog=true -PupdateVersionCode=$((1000+GITHUB_RUN_NUMBER)) -PupdateVersionName=${APP_VERSION} :app:assembleDebug --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/release-candidates/SETEC-TOOLS-v65-Separate.apk
      - name: Verify both APK application IDs and labels
        shell: bash
        run: |
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          "$AAPT" dump badging app/build/outputs/release-candidates/SETEC-TOOLS-Update-v65.apk | grep "package: name='mk.setecsifri.compare60'"
          "$AAPT" dump badging app/build/outputs/release-candidates/SETEC-TOOLS-v65-Separate.apk | grep "package: name='mk.setecsifri.compare60.catalog65'"
          "$AAPT" dump badging app/build/outputs/release-candidates/SETEC-TOOLS-v65-Separate.apk | grep "application-label:'Setec Tools'"
      - name: Sign and publish in-app updates
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/fix-offer-export-installments-20261108'
        env:
          UPDATE_KEYSTORE: ${{ secrets.UPDATE_KEYSTORE_BASE64 }}
          UPDATE_PASSWORD: ${{ secrets.UPDATE_KEYSTORE_PASSWORD }}
          UPDATE_ALIAS: ${{ secrets.UPDATE_KEY_ALIAS }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$UPDATE_KEYSTORE" ] || [ -z "$UPDATE_PASSWORD" ] || [ -z "$UPDATE_ALIAS" ]; then
            echo "::warning::Stable update signing key not configured; APK artifacts remain available but in-app publication is skipped."
            exit 0
          fi
          key="$RUNNER_TEMP/setec-update.jks"
          trap 'rm -f "$key"' EXIT
          if ! printf '%s' "$UPDATE_KEYSTORE" | tr -d '[:space:]' | base64 -d > "$key"; then
            echo "::error::UPDATE_KEYSTORE_BASE64 is invalid. Copy the complete Base64 text, not the JKS file or its filename."
            exit 1
          fi
          if ! keytool -list -keystore "$key" -storepass:env UPDATE_PASSWORD -alias "$UPDATE_ALIAS" >/dev/null 2>&1; then
            echo "::error::Signing keystore, password or alias is invalid. Check all three update secrets."
            exit 1
          fi
          code=$((1000+GITHUB_RUN_NUMBER))
          export UPDATE_CODE="$code"
          export UPDATE_NAME="$APP_VERSION"
          dir=app/build/outputs/release-candidates
          export UPDATE_DIR="$dir"
          signer="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          for variant in original separate; do
            if [ "$variant" = original ]; then input="$dir/SETEC-TOOLS-Update-v65.apk"; else input="$dir/SETEC-TOOLS-v65-Separate.apk"; fi
            output="$dir/Setec-Tools-$code-$variant.apk"
            "$signer" sign --ks "$key" --ks-key-alias "$UPDATE_ALIAS" --ks-pass env:UPDATE_PASSWORD --key-pass env:UPDATE_PASSWORD --out "$output" "$input"
            "$signer" verify "$output"
            cp "$output" "$input"
          done
          python3 - <<'PY'
          import os, json, hashlib, pathlib, subprocess
          d=pathlib.Path(os.environ["UPDATE_DIR"])
          code=int(os.environ["UPDATE_CODE"])
          packages={}
          for variant, package in [("original","mk.setecsifri.compare60"),("separate","mk.setecsifri.compare60.catalog65")]:
              f=d/f"Setec-Tools-{code}-{variant}.apk"
              packages[package]={"file":f.name,"size":f.stat().st_size,"sha256":hashlib.sha256(f.read_bytes()).hexdigest()}
          notes=subprocess.check_output(["git","log","-1","--pretty=%s"],text=True).strip()
          (d/"update.json").write_text(json.dumps({"versionCode":code,"versionName":os.environ["UPDATE_NAME"],"notes":notes,"packages":packages}))
          PY
          gh release view setec-tools-updates >/dev/null 2>&1 || gh release create setec-tools-updates --target "$GITHUB_SHA" --title "Setec Tools updates" --notes "Automatic Android updates" --latest=false
          gh release upload setec-tools-updates "$dir/Setec-Tools-$code-original.apk" "$dir/Setec-Tools-$code-separate.apk" --clobber
          gh release upload setec-tools-updates "$dir/update.json" --clobber
      - uses: actions/upload-artifact@v4
        with:
          name: Setec-Zaliha-APK
          path: app/build/outputs/release-candidates/SETEC-TOOLS-Update-v65.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: Setec-Categories-v65-Separate
          path: app/build/outputs/release-candidates/SETEC-TOOLS-v65-Separate.apk
          if-no-files-found: error
