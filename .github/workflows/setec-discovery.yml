name: Discover SETEC category links
on:
  push:
    branches: ['feature/datamatrix-setec-scan-2026-11-06']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Inspect site category data
        shell: bash
        run: |
          python3 - <<'PY'
          import urllib.request,re,json,html
          for url in ['https://www.setec.mk/','https://www.setec.mk/category/televizori-55']:
            print('URL',url,flush=True)
            try:
              req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 Chrome/131 Safari/537.36'})
              with urllib.request.urlopen(req,timeout=20) as r:
                data=r.read().decode('utf-8','replace')
                print('STATUS',r.status,'LEN',len(data),'FINAL',r.url,flush=True)
                print('HAS CONFIG', 'konfiguratsii-32' in data,'HAS TELEVIZORI','televizori-55' in data,flush=True)
                urls=re.findall(r'(?:(?:https?:)?//(?:www\.)?setec\.mk)?/category/[^\s\"\'<>]*',data)
                print('CATEGORIES',len(urls),'SAMPLES',urls[:30],flush=True)
                open('/tmp/setec-'+('home' if url.endswith('/') else 'tv')+'.html','w').write(data)
            except Exception as e:
              print('ERROR',str(e),flush=True)
          PY
