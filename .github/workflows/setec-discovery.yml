name: Discover SETEC category links
on:
  push:
    branches: ['feature/datamatrix-setec-scan-2026-11-06']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  discover:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Generate pinned official category tree
        shell: bash
        run: |
          python3 - <<'PY'
          import urllib.request,json,re,os
          url='https://www.setec.mk/api/strapi/category?locale=mk-MK&withSubcategories=true'
          req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 Chrome/131 Safari/537.36','Accept':'application/json'})
          with urllib.request.urlopen(req,timeout=35) as r:
            data=json.load(r)
          assert isinstance(data.get('categories'),list) and len(data['categories'])==12
          # Do not include age-restricted or weapon-related product categories in the embedded app.
          unsafe=re.compile(r'(?i)(?:ножеви|оружје|knife|knives|weapons|пепелници|цигари|cigarettes|алкохол|алкохолни|tobacco|петарди)')
          count=[0]
          def clean(src):
            if not isinstance(src,dict):return None
            name=str(src.get('name') or '').strip()
            slug=str(src.get('slug') or '').strip()
            if not name or not re.fullmatch('[a-zA-Z0-9%._-]+',slug) or unsafe.search(name):return None
            kids=[]
            for child in src.get('categories') or []:
              x=clean(child)
              if x:kids.append(x)
            count[0]+=1
            return {'name':name,'slug':slug,'children':kids}
          roots=[x for y in data['categories'] if (x:=clean(y))]
          assert len(roots)==12 and count[0]>300,(len(roots),count[0])
          out='// Snapshot of official SETEC category taxonomy (6 Nov 2026); category labels and slugs only.\nwindow.SETEC_OFFICIAL_CATEGORIES='+json.dumps(roots,ensure_ascii=False,separators=(',',':'))+';\n'
          path='app/src/main/assets/setec_categories.js'
          os.makedirs(os.path.dirname(path),exist_ok=True)
          with open(path,'w',encoding='utf-8') as f:f.write(out)
          print('GENERATED',path,'ROOTS',len(roots),'TOTAL NODES',count[0],'SIZE',len(out),flush=True)
          PY
      - name: Commit category snapshot
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/assets/setec_categories.js
          if ! git diff --cached --quiet; then
            git commit -m "Add official SETEC category tree [skip ci]"
            git push origin HEAD:feature/datamatrix-setec-scan-2026-11-06
          fi
