name: Discover SETEC category links
on:
  push:
    branches: ['feature/datamatrix-setec-scan-2026-11-06']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Retrieve official category taxonomy
        shell: bash
        run: |
          python3 - <<'PY'
          import urllib.request,json
          url='https://www.setec.mk/api/strapi/category?locale=mk-MK&withSubcategories=true'
          req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 Chrome/131 Safari/537.36','Accept':'application/json'})
          with urllib.request.urlopen(req,timeout=35) as r:
            body=r.read().decode('utf-8')
            print('HTTP',r.status,'length',len(body),flush=True)
            print('PREVIEW',body[:1200],flush=True)
          data=json.loads(body)
          print('ROOT TYPE',type(data).__name__,flush=True)
          print('ROOT KEYS',list(data.keys()) if isinstance(data,dict) else len(data),flush=True)
          with open('setec-category-taxonomy.json','w',encoding='utf-8') as f:json.dump(data,f,ensure_ascii=False,indent=2)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: setec-category-taxonomy
          path: setec-category-taxonomy.json
          if-no-files-found: error
